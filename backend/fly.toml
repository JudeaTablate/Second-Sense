# Fly.io app config. Run `flyctl launch` once locally to create the app
# and Postgres/Redis attachments, then this file drives subsequent
# `flyctl deploy` runs (including the one in ci-cd.yml).

app = "second-sense-api"          # change to your own unique app name
primary_region = "sin"       # Singapore — closest region to PH

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
